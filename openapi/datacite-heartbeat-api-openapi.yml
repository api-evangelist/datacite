openapi: 3.2.0
info:
  title: Datacite Heartbeat API
  version: '1.0'
  description: 'Operations tagged heartbeat across 2 of this provider''s published API definitions: datacite-rest-api-openapi.yml, datacite-usage-reports-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.test.datacite.org
  description: Staging server
- url: https://api.datacite.org
  description: Production server
- url: https://metrics.stage.datacite.org
  description: Staging server
tags:
- name: heartbeat
  description: Heartbeat
paths:
  /heartbeat:
    get:
      tags:
      - heartbeat
      summary: Return the current status of the REST API.
      security: []
      responses:
        '200':
          description: REST API is operating normally.
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          description: REST API is not working properly.
          content:
            text/plain:
              schema:
                type: string
                example: failed
    servers:
    - url: https://api.test.datacite.org
      description: Staging server
    - url: https://api.datacite.org
      description: Production server
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    Bearer:
      type: http
      scheme: bearer
      description: Token-based authentication for members
x-refined-from:
- datacite-rest-api-openapi.yml
- datacite-usage-reports-api-openapi.yml
