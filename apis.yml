aid: datacite
name: DataCite
description: 'DataCite is a leading global non-profit organization that provides DOI
  (Digital Object Identifier) registration and persistent identifier services for
  research outputs, enabling researchers to cite, discover, and access scholarly data.
  DataCite maintains a REST API for minting and managing DOIs, querying metadata records,
  and accessing the global research data graph. Membership-based access allows institutions
  to register DOIs through APIs and the Fabrica web interface, while public metadata
  retrieval is freely available to anyone. DataCite also offers a GraphQL API, a legacy
  Metadata Store (MDS) API, usage statistics via its Usage Reports API, and scholarly
  event tracking via the Event Data API.

  '
